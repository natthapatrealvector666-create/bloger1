services:
  - type: web
    name: bloger
    env: docker
    plan: free
    branch: main
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_URL
        # Render provides RENDER_EXTERNAL_URL automatically
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: LOG_CHANNEL
        value: stderr
      - key: GEMINI_API_KEY
        value: "" # Please set this in the Render dashboard
